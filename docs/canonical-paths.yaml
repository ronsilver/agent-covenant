# Canonical deployment paths per agent and target type.
# Used by scripts/validate-canonical-paths.sh to verify manifest.yaml paths
# match official documentation references.
#
# Format:
#   agents:
#     <agent-id>:
#       canonical_paths:
#         <target-type>:
#           - path: "<deployment path>"
#             source: "<documentation reference>"

agents:
  claude-code:
    canonical_paths:
      rules:
        - path: "${DETECTED_BASE}/CLAUDE.md"
          source: "https://docs.anthropic.com/claude-code/memory"
          note: "DETECTED_BASE resolves to ~/.claude (default) or ~/.claude-{name} (workspace)"
      skills:
        - path: "${DETECTED_BASE}/skills"
          source: "https://docs.anthropic.com/claude-code/skills"
      hooks:
        - path: "${DETECTED_BASE}/hooks"
          source: "https://docs.anthropic.com/claude-code/hooks"

  antigravity:
    canonical_paths:
      rules:
        - path: "${HOME}/.gemini/GEMINI.md"
          source: "internal"
      skills:
        - path: "${HOME}/.gemini/antigravity/skills"
          source: "internal"
      workflows:
        - path: "${HOME}/.gemini/antigravity/global_workflows"
          source: "internal"
      mcp:
        - path: "${HOME}/.gemini/antigravity/mcp_config.json"
          source: "internal"

  codex-cli:
    canonical_paths:
      rules:
        - path: "${HOME}/.codex/AGENTS.md"
          source: "https://github.com/openai/codex"
      skills:
        - path: "${HOME}/.codex/skills"
          source: "https://github.com/openai/codex"
      subagents:
        - path: "${HOME}/.codex/agents"
          source: "https://github.com/openai/codex"

  codex-app:
    canonical_paths:
      skills:
        - path: "${HOME}/.codex/skills"
          source: "https://github.com/openai/codex"

  pi:
    canonical_paths:
      rules:
        - path: "${HOME}/.pi/agent/AGENTS.md"
          source: "https://pi.dev/docs"
      skills:
        - path: "${HOME}/.pi/agent/skills"
          source: "https://pi.dev/docs"

  omp:
    canonical_paths:
      rules:
        - path: "${HOME}/.omp/agent/AGENTS.md"
          source: "https://omp.sh/docs"
      skills:
        - path: "${HOME}/.omp/agent/skills"
          source: "https://omp.sh/docs"
      mcp:
        - path: "${HOME}/.omp/agent/mcp.json"
          source: "https://omp.sh/docs/mcp-config"

  opencode:
    canonical_paths:
      rules:
        - path: "${HOME}/.config/opencode/AGENTS.md"
          source: "https://opencode.ai/docs/rules/"