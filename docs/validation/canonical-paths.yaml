# =============================================================================
# Canonical Paths - official per-agent paths
# =============================================================================
# This file documents canonical paths per official agent docs.
# Used to validate that manifest.yaml uses the correct paths.
#
# References:
# - Claude Code: https://code.claude.com/docs/en/claude-directory
# - Antigravity: https://codelabs.developers.google.com/getting-started-google-antigravity
# =============================================================================

version: "1.0"

agents:
  claude-code:
    description: "Claude Code (Anthropic) — default + workspace"
    canonical_paths:
      rules:
        # Default
        - path: "${HOME}/.claude/CLAUDE.md"
          format: merged
          scope: global
          source: "https://code.claude.com/docs/en/claude-directory"
        # Workspace variant
        - path: "${HOME}/.claude-{name}/CLAUDE.md"
          format: merged
          scope: workspace
          source: "https://code.claude.com/docs/en/claude-directory"
        # Project-level
        - path: "${REPO_ROOT}/.claude/CLAUDE.md"
          format: merged
          scope: workspace
      
      skills:
        - path: "${HOME}/.claude/skills"
          format: directory
          scope: global
          source: "https://code.claude.com/docs/en/skills"
        - path: "${HOME}/.claude-{name}/skills"
          format: directory
          scope: workspace
          source: "https://code.claude.com/docs/en/skills"
        - path: "${REPO_ROOT}/.claude/skills"
          format: directory
          scope: workspace
      
      commands:
        - path: "${HOME}/.claude/commands"
          format: individual
          scope: global
          source: "https://code.claude.com/docs/en/skills"
        - path: "${HOME}/.claude-{name}/commands"
          format: individual
          scope: workspace
          source: "https://code.claude.com/docs/en/skills"
        - path: "${REPO_ROOT}/.claude/commands"
          format: individual
          scope: workspace
      
      subagents:
        - path: "${HOME}/.claude/agents"
          format: individual
          scope: global
          source: "https://code.claude.com/docs/en/sub-agents"
        - path: "${HOME}/.claude-{name}/agents"
          format: individual
          scope: workspace
          source: "https://code.claude.com/docs/en/sub-agents"
        - path: "${REPO_ROOT}/.claude/agents"
          format: individual
          scope: workspace
      
      mcp:
        - path: "${HOME}/.claude/.mcp.json"
          format: json
          scope: global
          source: "https://code.claude.com/docs/en/mcp"
        - path: "${HOME}/.claude-{name}/.mcp.json"
          format: json
          scope: workspace
          source: "https://code.claude.com/docs/en/mcp"
        - path: "${REPO_ROOT}/.claude/.mcp.json"
          format: json
          scope: workspace

  antigravity:
    description: "Google Antigravity IDE"
    canonical_paths:
      rules:
        # Global GEMINI.md (deployed to ~/.gemini/GEMINI.md)
        - path: "${HOME}/.gemini/GEMINI.md"
          format: merged
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
      
      workflows:
        - path: "${HOME}/.gemini/antigravity/global_workflows"
          format: individual
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
      
      skills:
        # Global scope
        - path: "${HOME}/.gemini/antigravity/skills"
          format: directory
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
        
        # Workspace scope
        - path: "${REPO_ROOT}/.agents/skills"
          format: directory
          scope: workspace
      
      mcp:
        - path: "${HOME}/.gemini/antigravity/mcp_config.json"
          format: json
          scope: global

  codex-cli:
    description: "OpenAI Codex CLI"
    canonical_paths:
      rules:
        - path: "${HOME}/.codex/AGENTS.md"
          source: "https://github.com/openai/codex"
      skills:
        - path: "${HOME}/.codex/skills"
          source: "https://github.com/openai/codex"
      subagents:
        - path: "${HOME}/.codex/agents"
          source: "https://github.com/openai/codex"

  codex-app:
    description: "OpenAI Codex App (desktop)"
    canonical_paths:
      skills:
        - path: "${HOME}/.codex/skills"
          source: "https://github.com/openai/codex"

  pi:
    description: "Pi CLI agent"
    canonical_paths:
      rules:
        - path: "${HOME}/.pi/agent/AGENTS.md"
          source: "https://pi.dev/docs"
      skills:
        - path: "${HOME}/.pi/agent/skills"
          source: "https://pi.dev/docs"

  omp:
    description: "OMP (oh-my-pi)"
    canonical_paths:
      rules:
        - path: "${HOME}/.omp/agent/AGENTS.md"
          source: "https://omp.sh/docs"
      skills:
        - path: "${HOME}/.omp/agent/skills"
          source: "https://omp.sh/docs"
      mcp:
        - path: "${HOME}/.omp/agent/mcp.json"
          source: "https://omp.sh/docs/mcp-config"

notes:
  - "Paths with ${HOME} are global (apply to all projects)"
  - "Paths with ${REPO_ROOT} are workspace-specific"
  - "Some agents support both scopes with workspace > global precedence"
  - "Platform-specific paths activate only on the corresponding OS"
  - "Validation must consider that paths may not exist yet (created during sync)"