# =============================================================================
# Canonical Paths - Documentación oficial de paths por agente
# =============================================================================
# Este archivo documenta los paths canónicos según la documentación oficial
# de cada agente. Se usa para validar que manifest.yaml use los paths correctos.
#
# Referencias:
# - Claude Code: https://code.claude.com/docs/en/claude-directory
# - Windsurf: https://dev.to/yardenporat/codium-windsurf-ide-rules-file-1hn9
# - Antigravity: https://codelabs.developers.google.com/getting-started-google-antigravity
# =============================================================================

version: "1.0"

agents:
  windsurf:
    description: "Windsurf IDE / Codeium Cascade"
    canonical_paths:
      rules:
        # Global rules (memoria persistente)
        - path: "${HOME}/.codeium/windsurf/memories/global_rules.md"
          format: merged
          scope: global
          source: "https://docs.codeium.com/windsurf/cascade"
        
        # Project-level rules (wave 8+)
        - path: "${REPO_ROOT}/.windsurf/rules/*.md"
          format: individual
          scope: workspace
          source: "https://windsurf.com/blog/windsurf-wave-8-cascade-customization-features"
      
      workflows:
        - path: "${HOME}/.codeium/windsurf/global_workflows"
          format: individual
          scope: global
          source: "https://docs.codeium.com/windsurf/cascade"
        
        - path: "${REPO_ROOT}/.windsurf/workflows"
          format: individual
          scope: workspace
      
      skills:
        - path: "${HOME}/.codeium/windsurf/skills"
          format: directory
          scope: global
        
        - path: "${REPO_ROOT}/.windsurf/skills"
          format: directory
          scope: workspace
      
      subagents:
        - path: "${HOME}/.codeium/windsurf/agents"
          format: individual
          scope: global
        
        - path: "${REPO_ROOT}/.windsurf/agents"
          format: individual
          scope: workspace
      
      mcp:
        - path: "${HOME}/.codeium/windsurf/mcp_config.json"
          format: json
          scope: global

  windsurf-jetbrains:
    description: "Codeium Plugin for JetBrains IDEs"
    canonical_paths:
      rules:
        - path: "${HOME}/.codeium/memories/global_rules.md"
          format: merged
          scope: global
      
      workflows:
        - path: "${HOME}/.codeium/global_workflows"
          format: individual
          scope: global
      
      skills:
        - path: "${HOME}/.codeium/skills"
          format: directory
          scope: global
      
      subagents:
        - path: "${HOME}/.codeium/agents"
          format: individual
          scope: global
      
      mcp:
        - path: "${HOME}/.codeium/mcp_config.json"
          format: json
          scope: global

  claude-code:
    description: "Claude Code (Anthropic) — default + workspace"
    canonical_paths:
      rules:
        # Default
        - path: "${HOME}/.claude/CLAUDE.md"
          format: merged
          scope: global
          source: "https://code.claude.com/docs/en/claude-directory"
        # Workspace variant
        - path: "${HOME}/.claude-{name}/CLAUDE.md"
          format: merged
          scope: workspace
          source: "https://code.claude.com/docs/en/claude-directory"
        # Project-level
        - path: "${REPO_ROOT}/.claude/CLAUDE.md"
          format: merged
          scope: workspace
      
      skills:
        - path: "${HOME}/.claude/skills"
          format: directory
          scope: global
          source: "https://code.claude.com/docs/en/skills"
        - path: "${HOME}/.claude-{name}/skills"
          format: directory
          scope: workspace
          source: "https://code.claude.com/docs/en/skills"
        - path: "${REPO_ROOT}/.claude/skills"
          format: directory
          scope: workspace
      
      commands:
        - path: "${HOME}/.claude/commands"
          format: individual
          scope: global
          source: "https://code.claude.com/docs/en/skills"
        - path: "${HOME}/.claude-{name}/commands"
          format: individual
          scope: workspace
          source: "https://code.claude.com/docs/en/skills"
        - path: "${REPO_ROOT}/.claude/commands"
          format: individual
          scope: workspace
      
      subagents:
        - path: "${HOME}/.claude/agents"
          format: individual
          scope: global
          source: "https://code.claude.com/docs/en/sub-agents"
        - path: "${HOME}/.claude-{name}/agents"
          format: individual
          scope: workspace
          source: "https://code.claude.com/docs/en/sub-agents"
        - path: "${REPO_ROOT}/.claude/agents"
          format: individual
          scope: workspace
      
      mcp:
        - path: "${HOME}/.claude/.mcp.json"
          format: json
          scope: global
          source: "https://code.claude.com/docs/en/mcp"
        - path: "${HOME}/.claude-{name}/.mcp.json"
          format: json
          scope: workspace
          source: "https://code.claude.com/docs/en/mcp"
        - path: "${REPO_ROOT}/.claude/.mcp.json"
          format: json
          scope: workspace

  claude-desktop:
    description: "Claude Desktop (Anthropic)"
    canonical_paths:
      mcp:
        - path: "${HOME}/Library/Application Support/Claude/claude_desktop_config.json"
          format: json
          scope: global
          platform: macos
          source: "https://modelcontextprotocol.io/quickstart/user"
        
        - path: "${HOME}/.config/Claude/claude_desktop_config.json"
          format: json
          scope: global
          platform: linux

  antigravity:
    description: "Google Antigravity IDE"
    canonical_paths:
      rules:
        # Global GEMINI.md (compartido con gemini-cli)
        - path: "${HOME}/.gemini/GEMINI.md"
          format: merged
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
      
      workflows:
        - path: "${HOME}/.gemini/antigravity/global_workflows"
          format: individual
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
      
      skills:
        # Global scope
        - path: "${HOME}/.gemini/antigravity/skills"
          format: directory
          scope: global
          source: "https://codelabs.developers.google.com/getting-started-google-antigravity"
        
        # Workspace scope
        - path: "${REPO_ROOT}/.agents/skills"
          format: directory
          scope: workspace
      
      mcp:
        - path: "${HOME}/.gemini/antigravity/mcp_config.json"
          format: json
          scope: global

  gemini-cli:
    description: "Google Gemini CLI"
    canonical_paths:
      rules:
        - path: "${HOME}/.gemini/GEMINI.md"
          format: merged
          scope: global

  copilot-vscode:
    description: "GitHub Copilot (VS Code)"
    canonical_paths:
      rules:
        - path: "${HOME}/Library/Application Support/Code/User/prompts/Default.instructions.md"
          format: merged
          scope: global
          platform: macos
          source: "https://docs.github.com/en/copilot/customizing-copilot/adding-custom-instructions-for-github-copilot"
        
        - path: "${HOME}/.config/Code/User/prompts/Default.instructions.md"
          format: merged
          scope: global
          platform: linux
      
      prompts:
        - path: "${HOME}/Library/Application Support/Code/User/prompts"
          format: individual
          scope: global
          platform: macos

  copilot-intellij:
    description: "GitHub Copilot (IntelliJ/JetBrains)"
    canonical_paths:
      rules:
        - path: "${HOME}/.config/github-copilot/intellij/Default.instructions.md"
          format: merged
          scope: global

  cursor:
    description: "Cursor IDE"
    canonical_paths:
      rules:
        - path: "${HOME}/.cursor/rules/global.mdc"
          format: merged
          scope: global
          source: "https://docs.cursor.com/context/rules-for-ai"

notes:
  - "Los paths con ${HOME} son globales (aplican a todos los proyectos)"
  - "Los paths con ${REPO_ROOT} son workspace-specific"
  - "Algunos agentes soportan ambos scopes con precedencia workspace > global"
  - "Platform-specific paths se activan solo en el OS correspondiente"
  - "La validación debe considerar que paths pueden no existir aún (se crean en sync)"
