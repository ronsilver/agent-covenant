# =============================================================================
# Per-Agent Configuration
# =============================================================================
agents:
  claude-code:
    enabled: true
    description: "Claude Code (Anthropic) — supports default ~/.claude and ~/.claude-{name} workspaces"
    detect:
      paths:
        # Workspace paths (higher priority — first match wins)
        - "${HOME}/.claude-workspace"
        # Default path (fallback)
        - "${HOME}/.claude"
      commands: []
    path_strategy: detect_as_base
    targets:
      rules:
        path: "${DETECTED_BASE}"
        format: merged
        output_filename: "CLAUDE.md"
        strip_frontmatter: true
        # Kernel mode: deploy claude-code-global.md standalone (not merged with core rules).
        # Remove this to revert to the full merge of agents/claude-code.md + core/*.md.
        source_files:
          - agents/claude-code-global.md
      skills:
        path: "${DETECTED_BASE}/skills"
        format: directory
        shared: true
        transform: none
      subagents:
        path: "${DETECTED_BASE}/agents"
        format: individual
        shared: true
        transform: strip
      mcp:
        path: "${DETECTED_BASE}/.mcp.json"
        format: json
      hooks:
        scripts_path: "${DETECTED_BASE}/hooks"
        shared: true
        transform: none
        settings_path: "${DETECTED_BASE}/settings.json"
        settings_fragment: "hooks/claude-code/settings.fragment.json"
        scripts:
          - "hooks/claude-code/baseline-skills.sh"
          - "hooks/claude-code/require-read.sh"
          - "hooks/claude-code/word-budget.sh"
          - "hooks/claude-code/memory-persist.sh"
          - "hooks/claude-code/git-guardrails.sh"
          - "hooks/claude-code/injection-scan.sh"
          - "hooks/claude-code/done-gate.sh"
        format: hooks
  codex-cli:
    enabled: true
    description: "OpenAI Codex CLI"
    detect:
      paths: []
      commands:
        - "codex --version"
    targets:
      rules:
        path: "${HOME}/.codex/AGENTS.md"
        format: merged
        strip_frontmatter: true
        source_files:
          - agents/codex-cli-global.md
      skills:
        path: "${HOME}/.codex/skills"
        format: directory
        shared: true
        transform: none
      subagents:
        path: "${HOME}/.codex/agents"
        format: individual
        shared: true
        transform: strip
        # mcp: codex-cli uses ~/.codex/config.toml (TOML format) — not supported by sync.sh (json only).
        # Manage manually: add MCP servers to ~/.codex/config.toml under [mcp] section.
  codex-app:
    enabled: true
    description: "OpenAI Codex App (desktop)"
    detect:
      paths:
        - "/Applications/Codex.app"
      commands: []
    targets:
      # Codex App shares MCP config with Codex CLI (~/.codex/config.toml)
      # Skills also shared via ~/.codex/skills
      skills:
        path: "${HOME}/.codex/skills"
        format: directory
        shared: true
        transform: none
        # mcp: shared with codex-cli (~/.codex/config.toml, TOML format) — not supported by sync.sh.
        # Manage manually alongside codex-cli MCP config.
  antigravity:
    enabled: true
    description: "Google Antigravity IDE"
    detect:
      paths:
        - "/Applications/Antigravity.app"
        - "${HOME}/.gemini/antigravity"
      commands: []
    targets:
      rules:
        path: "${HOME}/.gemini/GEMINI.md"
        format: merged
        strip_frontmatter: true
        # Kernel mode: deploy antigravity-global.md to ~/.gemini/GEMINI.md.
        source_files:
          - agents/antigravity-global.md
      workflows:
        path: "${HOME}/.gemini/antigravity/global_workflows"
        format: individual
        output_extension: ".md"
        strip_frontmatter: false
      skills:
        path: "${HOME}/.gemini/antigravity/skills"
        format: directory
        shared: true
        transform: none
      #subagents:
      #  path: "${HOME}/.gemini/antigravity/agents"
      #  format: individual
      #  strip_frontmatter: true
      mcp:
        path: "${HOME}/.gemini/antigravity/mcp_config.json"
        format: json
  opencode:
    enabled: true
    description: "OpenCode"
    detect:
      paths: []
      commands:
        - "opencode --version"
    targets:
      rules:
        path: "${HOME}/.config/opencode/AGENTS.md"
        format: merged
        strip_frontmatter: true
        # Kernel mode: deploy opencode-global.md standalone.
        source_files:
          - agents/opencode-global.md
      skills:
        path: "${HOME}/.config/opencode/skills"
        format: directory
        shared: true
        transform: none
      subagents:
        path: "${HOME}/.config/opencode/agents"
        format: individual
        shared: true
        transform: opencode
      mcp:
        path: "${HOME}/.config/opencode/opencode.json"
        format: json
        source_file: "opencode-mcp.json"
        merge_key: "mcp"
      config:
        path: "${HOME}/.config/opencode/opencode.json"
        format: json
        source_file: "opencode-agents-config.json"
        merge_key: "agent"
        inject_keys:
          subagent_depth: 3
          # hooks: disabled — opencode plugin API differs from claude-code hooks;
          # baseline-skill loading is handled via opencode-global.md kernel rules instead
# hooks:
      #   scripts_path: "${HOME}/.config/opencode/plugins"
      #   scripts:
      #     - "hooks/opencode/baseline-skills-plugin.js"
      #   format: hooks

  pi:
    enabled: true
    description: "Pi CLI agent"
    detect:
      paths: []
      commands:
        - "pi --version"
    targets:
      rules:
        path: "${HOME}/.pi/agent/AGENTS.md"
        format: merged
        strip_frontmatter: true
        # Kernel mode: deploy pi-global.md standalone.
        source_files:
          - agents/pi-global.md

      skills:
        path: "${HOME}/.pi/agent/skills"
        format: directory
        shared: true
        transform: none

      # mcp: none — pi has no native MCP support. subagents: none — pi has no file-based subagents.

  omp:
    enabled: true
    description: "OMP (oh-my-pi)"
    detect:
      paths: []
      commands:
        - "omp --version"
    targets:
      rules:
        path: "${HOME}/.omp/agent/AGENTS.md"
        format: merged
        strip_frontmatter: true
        # Kernel mode: deploy omp-global.md standalone.
        source_files:
          - agents/omp-global.md

      skills:
        path: "${HOME}/.omp/agent/skills"
        format: directory
        shared: true
        transform: none

      mcp:
        path: "${HOME}/.omp/agent/mcp.json"
        format: json
        source_file: "mcp.json"
        merge_key: "mcpServers"
