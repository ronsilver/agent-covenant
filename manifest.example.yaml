# =============================================================================
# Agent Covenant - Manifest de Configuración v2.0
# =============================================================================
# Este archivo define la configuración central para sincronizar reglas
# a diferentes agentes de AI (Windsurf, GitHub Copilot, Cursor, Antigravity, etc.)
#
# Uso: ./scripts/sync.sh [--agent <nombre>] [--dry-run]
# =============================================================================

version: "2.0"

# =============================================================================
# Directorio de contenido (nueva estructura organizada)
# =============================================================================

content_dir: "content"

rules:
  source_dir: "rules"
  # ARCHITECTURE DECISION: All agents use format:merged + strip_frontmatter:true → single file, trigger:always.
  # Individual trigger types (glob, model_decision) are NOT supported for rules across agents — compatibility constraint.
  # Consequence: rules are always-on. Differentiated activation (e.g. only on .tf files) must live in skills (model_decision via description).
  # MUST NOT change to format:individual without verifying all agent destinations support multi-file rule loading.
  files:
    # Core rules (global - todos los agentes) — MUST remain last for precedence
    - core/context-management.md
    - core/tool-usage.md
    - core/token-efficiency.md
    - core/operating-protocol.md
    - core/engineering-standards.md
    - core/governance.md

workflows:
  source_dir: "workflows"
  files:
    # Validation
    - validation/validate.md
    - validation/test.md
    - validation/lint.md
    # Git
    - git/pre-push.md
    - git/pr-review.md
    - git/fix-pr-comments.md
    # Infrastructure
    - infrastructure/terraform-module.md
    - infrastructure/docker-build.md
    - infrastructure/k8s-validate.md
    # Security
    - security/security-check.md

prompts:
  source_dir: "prompts"
  files: []

instructions:
  source_dir: "rules"

skills:
  source_dir: "skills"
  # Skills are directory-based (each entry is a directory name containing SKILL.md)
  # See: https://agentskills.io/specification
