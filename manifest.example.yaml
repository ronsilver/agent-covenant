# =============================================================================
# Agent Covenant - Configuration Manifest v2.0
# =============================================================================
# This file defines the central configuration for synchronizing rules
# to different AI agents (Claude Code, OpenCode, Antigravity, Codex CLI, Codex App, Pi, OMP).
#
# Usage: ./scripts/sync.sh [--agent <name>] [--dry-run]
# =============================================================================

version: "2.0"
# =============================================================================
# Directorio de contenido (nueva estructura organizada)
# =============================================================================
# Shared base for directory-format targets (skills/subagents/hooks). Content is
# written ONCE here; each agent's real dir (target `path`) is symlinked into it
# by scripts/bootstrap-symlinks.sh. File-level targets (rules/mcp/config) stay
# per-agent and ignore this base.
shared_base: "${HOME}/.config/agent-covenant"
content_dir: "content"
rules:
  source_dir: "rules"
  # ARCHITECTURE DECISION: All agents use format:merged + strip_frontmatter:true → single file, trigger:always.
  # Individual trigger types (glob, model_decision) are NOT supported for rules across agents — compatibility constraint.
  # Consequence: rules are always-on. Differentiated activation (e.g. only on .tf files) must live in skills (model_decision via description).
  # MUST NOT change to format:individual without verifying all agent destinations support multi-file rule loading.
  files:
    # Core rules (global - all agents) — MUST remain last for precedence
    - core/context-management.md
    - core/tool-usage.md
    - core/token-efficiency.md
    - core/operating-protocol.md
    - core/engineering-standards.md
    - core/governance.md
workflows:
  source_dir: "workflows"
  files:
    # Validation
    - validation/validate.md
    - validation/test.md
    - validation/lint.md
    # Git
    - git/pre-push.md
    - git/pr-review.md
    - git/fix-pr-comments.md
    # Infrastructure
    - infrastructure/terraform-module.md
    - infrastructure/docker-build.md
    - infrastructure/k8s-validate.md
    # Security
    - security/security-check.md
prompts:
  source_dir: "prompts"
  files: []
instructions:
  source_dir: "rules"
