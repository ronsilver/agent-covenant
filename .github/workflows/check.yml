name: Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Reusable tool-installation steps are inlined per-job to keep jobs independent
# and fully parallel.  Each job installs only what it needs.
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Shell lint (shellcheck + shfmt) ───────────────────────────────────
  lint-shell:
    name: "Lint: Shell (shellcheck + shfmt)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install shellcheck
        run: |
          curl -sSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C /usr/local/bin shellcheck-v0.11.0/shellcheck

      - name: Install shfmt
        run: |
          curl -sSL https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_linux_amd64 \
            -o /usr/local/bin/shfmt
          chmod +x /usr/local/bin/shfmt

      - name: shellcheck
        run: make lint

      - name: shfmt (format check)
        run: make fmt-check

  # ── 2. Markdown lint ─────────────────────────────────────────────────────
  lint-markdown:
    name: "Lint: Markdown"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.44.0

      - name: markdownlint
        run: make lint-md

  # ── 3. YAML / JSON lint ──────────────────────────────────────────────────
  lint-yaml-json:
    name: "Lint: YAML + JSON"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq and jq
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          sudo apt-get install -y jq

      - name: lint-yaml-json
        run: make lint-yaml-json

  # ── 4. Security scan (gitleaks) ──────────────────────────────────────────
  security:
    name: "Security: Secret scan (gitleaks)"
    if: ${{ false }}  # Disabled: gitleaks license not available (documented exception, see AGENTS.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Manifest + skill validation ───────────────────────────────────────
  # Benchmark targets (benchmark-live / benchmark-probe / benchmark-dry) are
  # EXCLUDED from CI by policy: benchmark-live spends LLM money. The guard step
  # in this job fails CI if `make check` ever resolves to a benchmark target.
  # Do NOT add a benchmark job or step to this workflow.
  validate:
    name: "Validate: Manifest + Skills"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install yq and jq
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          sudo apt-get install -y jq

      - name: "Guard: benchmark excluded from CI (policy: LLM cost)"
        run: |
          make -n check | grep -q benchmark && { echo "ERROR: benchmark target in make check chain; CI policy forbids benchmark."; exit 1; } || true

      - name: Validate manifest and skills
        run: make validate

      - name: Validate no-fintech
        run: make validate-no-fintech

      - name: Validate skill quality
        run: make validate-quality

      - name: Validate shell safety
        run: make validate-shell-safety

      - name: Skill reference integrity (informational)
        run: make validate-skill-refs
        continue-on-error: true

  # ── 6. Bats unit tests ───────────────────────────────────────────────────
  test:
    name: "Test: Bats"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Install yq and jq
        run: |
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          sudo apt-get install -y jq

      - name: Run bats tests
        run: make test

  # ── Gate: all 6 jobs must pass ───────────────────────────────────────────
  ci-gate:
    name: "CI Gate"
    runs-on: ubuntu-latest
    needs:
      - lint-shell
      - lint-markdown
      - lint-yaml-json
      - validate
      - test
    steps:
      - name: All checks passed
        run: echo "All parallel checks passed."
