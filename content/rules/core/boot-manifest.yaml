# Boot Manifest — Skills Runtime MUST Load Before Any Tool Use
# trigger: always marks BOOT CATALOG MEMBERSHIP, not automatic injection.
# Injection is per-agent: Claude Code YES (@import lines in claude-code-global.md
# expand full SKILL.md bodies); OpenCode and all other agents NO — the model
# itself MUST invoke every boot skill via skill() as Step 0 (kernel <REINFORCE> step 0).
# trigger: on-demand skills are loaded via skill() tool.
# Subagents (content/subagents/): the conditional split below does NOT apply —
# every subagent loads all 7 boot skills unconditionally at its Step 0
# (AGENTS.md Architectural Invariant #4).

version: "1.0"

boot_skills:
  # Global flow — loaded before ANY task, always present
  global:
    core_immutable:
      - context-management
      - engineering-standards
      - governance
      - operating-protocol
      - token-efficiency
      - tool-usage
    mandatory_domain:
      - skill-router

  # Plan flow — loaded after global, before planning phase
  plan_mode:
    feature:
      - planning-expert
      - reasoning-expert
      - research-expert
    bug:
      - evaluation-expert
      - debugging-expert
      - planning-expert
      - reasoning-expert
      - research-expert

  # Build flow — skill-router already loaded in global;
  # agent invokes it dynamically for full catalog
  build_mode:
    extends: global
